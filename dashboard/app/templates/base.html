<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}PT Logistics Dashboard{% endblock %}</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; font-family: Inter, system-ui, -apple-system, sans-serif; }
    :root {
      --page-bg: #f4f1eb;
      --panel: #fffdf9;
      --panel-2: #ebe3d6;
      --ink: #171a24;
      --muted: #697084;
      --faint: #969baa;
      --line: #ddd3c4;
      --dark: #191c28;
      --accent: #c77718;
      --accent-soft: rgba(199, 119, 24, .12);
      --green: #178f56;
      --green-soft: #e3f4ea;
      --blue: #336acb;
      --blue-soft: #e6edf9;
      --red: #c54242;
      --red-soft: #f8e7e7;
      --amber: #ad6d00;
      --amber-soft: #f7ebcf;
      --shadow: 0 10px 30px rgba(23, 26, 36, .08), 0 2px 8px rgba(23, 26, 36, .05);
    }
    body { min-height: 100vh; background: var(--page-bg); color: var(--ink); font-size: 14px; line-height: 1.45; }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .shell { max-width: 1520px; margin: 0 auto; padding: 24px 28px 48px; }
    .read-only-banner {
      background: var(--amber-soft); color: var(--ink); border-bottom: 1px solid var(--line);
      padding: 10px 28px; text-align: center; font-size: 13px; font-weight: 700;
    }
    .topbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 20px; }
    .primary-nav { display: flex; gap: 14px; margin-bottom: 18px; font-size: 13px; font-weight: 700; }
    .eyebrow { color: var(--muted); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
    h1 { font-size: 26px; line-height: 1; letter-spacing: 0; font-weight: 900; margin-top: 6px; }
    .subtle { color: var(--muted); font-size: 13px; }
    .btn {
      border: 1px solid var(--line); border-radius: 8px; background: var(--panel);
      color: var(--ink); padding: 8px 13px; font-size: 12px; font-weight: 700;
      transition: background .12s, border-color .12s, opacity .12s;
    }
    .btn:hover { border-color: #c7b9a4; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: white; }
    .btn-dark { background: var(--dark); border-color: var(--dark); color: white; }
    .notif {
      position: fixed; top: 18px; right: 18px; z-index: 30; max-width: 360px;
      padding: 10px 14px; border-radius: 10px; background: var(--panel);
      border: 1px solid var(--line); box-shadow: var(--shadow); font-size: 12px;
    }
    .hidden { display: none !important; }
    [x-cloak] { display: none !important; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbbfae; border-radius: 999px; }
    {% block extra_styles %}{% endblock %}
  </style>
</head>
<body>
  <aside class="read-only-banner" role="status">
    Esta interface protegida é apenas de leitura. Alterações exigem um canal autenticado no servidor.
  </aside>
  <div id="notif" class="notif hidden"></div>
  <main class="shell">
    <nav class="primary-nav" aria-label="CRM"><a href="/leads">Leads</a><a href="/contas">Contas</a><a href="/propostas">Propostas</a><a href="/inteligencia">Inteligência</a></nav>
    {% block content %}{% endblock %}
  </main>
  <script>
    function notify(message, type = 'ok') {
      const el = document.getElementById('notif');
      el.textContent = message;
      el.style.color = type === 'err' ? 'var(--red)' : 'var(--green)';
      el.style.borderColor = type === 'err' ? 'rgba(197,66,66,.35)' : 'rgba(23,143,86,.35)';
      el.classList.remove('hidden');
      setTimeout(() => el.classList.add('hidden'), 4200);
    }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
